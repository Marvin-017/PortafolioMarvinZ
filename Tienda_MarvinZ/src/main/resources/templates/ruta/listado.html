<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Rutas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h2 class="mb-0">Gestión de Rutas</h2>
            </div>
            
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered align-middle text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Ruta Web</th>
                                <th>¿Requiere Rol?</th>
                                <th>Rol Asignado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${rutas}">
                                <td th:text="${r.idRuta}" class="fw-bold">1</td>
                                <td th:text="${r.ruta}">/ejemplo/ruta</td>
                                
                                <td>
                                    <span th:if="${r.requiereRol}" class="badge bg-success">Sí</span>
                                    <span th:unless="${r.requiereRol}" class="badge bg-secondary">No</span>
                                </td>
                                
                                <td th:text="${r.rol != null ? r.rol.idRol : 'Ninguno'}">Admin</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
